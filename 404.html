<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#1a2744;color:#f4f7ff;line-height:1.7;min-height:100vh;
    display:grid;place-items:center;padding:32px;

  .box{width:min(620px,100%);text-align:center}
  .logo{display:inline-flex;align-items:center;gap:12px;margin-bottom:28px;text-decoration:none;color:inherit}
  .mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#ff8a4c,#e85d2f);display:grid;place-items:center;box-shadow:0 10px 24px -10px rgba(255,138,76,.9)}
  .mark svg{width:24px;height:24px;fill:#fff}
  .txt b{display:block;font-size:17px;font-weight:800;line-height:1.1}
  .txt span{font-size:10px;color:#ffab7a;letter-spacing:2.5px;font-weight:600}
  .code{font-size:clamp(72px,16vw,120px);font-weight:800;letter-spacing:-4px;line-height:1;background:linear-gradient(135deg,#ff8a4c,#ffab7a);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px}
  h1{font-size:clamp(22px,3.4vw,30px);margin-bottom:12px;font-weight:800}
  p{color:#b8c4dd;margin-bottom:26px}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-block;padding:12px 28px;border-radius:10px;font-weight:700;text-decoration:none;font-size:14px;transition:.24s}
  .btn-brand{background:linear-gradient(135deg,#ff8a4c,#e85d2f);color:#fff;box-shadow:0 10px 24px -10px rgba(255,138,76,.9)}
  .btn-brand:hover{transform:translateY(-1px)}
  .btn-ghost{color:#b8c4dd;border:1px solid rgba(255,255,255,.16)}
  .btn-ghost:hover{color:#ffab7a;border-color:rgba(255,138,76,.4)}
  .links{margin-top:30px;font-size:13px;color:#7e8ba7}
  .links a{color:#b8c4dd;text-decoration:none;margin:0 8px}
  .links a:hover{color:#ffab7a}

    <div class="actions">
